<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Basic Delay</title>
        <style>
            :root {
                --bg: #f6f5f2;
                --panel: #ffffff;
                --text: #1d1d1f;
                --muted: #6b6b70;
                --accent: #2f6fdb;
                --border: #dddad3;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #17181a;
                    --panel: #222326;
                    --text: #f1f1f2;
                    --muted: #a0a0a6;
                    --accent: #6b9cf0;
                    --border: #35363a;
                }
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                padding: 32px 16px;
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                display: flex;
                justify-content: center;
            }
            main { width: 100%; max-width: 520px; }
            h1 { margin: 0 0 4px; font-size: 1.6rem; }
            .subtitle { margin: 0 0 24px; color: var(--muted); }
            .panel {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 24px;
            }
            button {
                font: inherit;
                font-weight: 600;
                border: none;
                border-radius: 8px;
                padding: 12px 20px;
                background: var(--accent);
                color: #fff;
                cursor: pointer;
                width: 100%;
            }
            button:disabled { opacity: 0.5; cursor: default; }
            #controls { display: none; }
            #play { margin-bottom: 24px; }
            .param { margin-bottom: 20px; }
            .param:last-child { margin-bottom: 0; }
            .param-head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 6px;
            }
            .param label { font-weight: 600; }
            .param .hint { font-size: 0.85rem; color: var(--muted); }
            output {
                font-variant-numeric: tabular-nums;
                min-width: 70px;
                text-align: right;
            }
            input[type=range] { width: 100%; accent-color: var(--accent); }
        </style>
    </head>
    <body>
        <main>
            <h1>Basic Delay</h1>
            <p class="subtitle">y[n] = blend · x[n] + feedforward · x[n − D]</p>

            <div class="panel">
                <button id="start" disabled>Loading…</button>

                <div id="controls">
                    <button id="play">▶ Play</button>

                    <div class="param">
                        <div class="param-head">
                            <label for="delayTime">Delay time</label>
                            <output id="delayTimeOut"></output>
                        </div>
                        <input type="range" id="delayTime">
                        <div class="hint">0 – 5000 ms</div>
                    </div>

                    <div class="param">
                        <div class="param-head">
                            <label for="feedforward">Feedforward gain</label>
                            <output id="feedforwardOut"></output>
                        </div>
                        <input type="range" id="feedforward">
                        <div class="hint">Level of the delayed signal, 0 – 1</div>
                    </div>

                    <div class="param">
                        <div class="param-head">
                            <label for="blend">Blend gain</label>
                            <output id="blendOut"></output>
                        </div>
                        <input type="range" id="blend">
                        <div class="hint">Level of the dry signal, 0 – 1</div>
                    </div>
                </div>
            </div>
        </main>

        <script src="webpd-runtime.js"></script>
        <script>
            // ------------- PARAMETERS
            // Each slider sends its value to a number box inside the Pd patch.
            // min / max lock the range students see; value is the preset
            // sent as soon as the audio starts. scale multiplies the slider value
            // before it reaches the patch.
            const PARAMS = [
                { id: 'delayTime',   nodeId: 'n_0_9',  min: 0, max: 5000, step: 1,    value: 500, scale: 1,   unit: ' ms' },
                // Gains show 0–1 but are scaled by 0.5, so the patch only ever gets 0–0.5.
                // Dry + delayed can then never exceed full scale (no clipping).
                { id: 'feedforward', nodeId: 'n_0_7',  min: 0, max: 1,    step: 0.01, value: 0.5, scale: 0.5, unit: '' },
                { id: 'blend',       nodeId: 'n_0_12', min: 0, max: 1,    step: 0.01, value: 0.5, scale: 0.5, unit: '' },
            ]
            // Bang that triggers the sample (it plays tape_snare.wav through the patch)
            const PLAY_NODE = 'n_0_2'

            // Note: the maximum delay time is fixed at 5000 ms inside the patch
            // (delwrite~ buffer), so there is no control for it here.

            // ------------- WEB PAGE INITIALIZATION
            const startButton = document.querySelector('#start')
            const controls = document.querySelector('#controls')
            const playButton = document.querySelector('#play')
            const audioContext = new AudioContext()

            let patch = null
            let webpdNode = null

            const sendMsgToWebPd = (nodeId, portletId, message) => {
                if (!webpdNode) return
                webpdNode.port.postMessage({
                    type: 'io:messageReceiver',
                    payload: { nodeId, portletId, message },
                })
            }

            const format = (p, v) => (p.step < 1 ? Number(v).toFixed(2) : v) + p.unit

            // Build sliders from PARAMS
            PARAMS.forEach((p) => {
                const slider = document.getElementById(p.id)
                const out = document.getElementById(p.id + 'Out')
                slider.min = p.min
                slider.max = p.max
                slider.step = p.step
                slider.value = p.value
                out.textContent = format(p, p.value)
                slider.addEventListener('input', () => {
                    // Clamp just in case, so nothing outside the range reaches the patch
                    const v = Math.min(p.max, Math.max(p.min, parseFloat(slider.value)))
                    out.textContent = format(p, v)
                    sendMsgToWebPd(p.nodeId, '0', [v * p.scale])
                })
            })

            const initApp = async () => {
                await WebPdRuntime.initialize(audioContext)
                const response = await fetch('patch.js')
                patch = await response.text()

                startButton.textContent = 'Start audio'
                startButton.disabled = false
            }

            const startApp = async () => {
                if (audioContext.state === 'suspended') {
                    audioContext.resume()
                }

                webpdNode = await WebPdRuntime.run(
                    audioContext,
                    patch,
                    WebPdRuntime.defaultSettingsForRun('./patch.js', receiveMsgFromWebPd),
                )
                webpdNode.connect(audioContext.destination)

                // Send the preset values so the effect works right away
                PARAMS.forEach((p) => sendMsgToWebPd(p.nodeId, '0', [p.value * p.scale]))

                startButton.style.display = 'none'
                controls.style.display = 'block'
            }

            startButton.onclick = startApp
            playButton.onclick = () => sendMsgToWebPd(PLAY_NODE, '0', ['bang'])

            initApp().then(() => console.log('App initialized'))

            // Messages coming back from the patch (not used by this page)
            const receiveMsgFromWebPd = (nodeId, portletId, message) => {}
        </script>
    </body>
</html>
